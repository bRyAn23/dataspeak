# Data Speak production stack for the single EC2 (MVP layout): Laravel API (FrankenPHP with automatic HTTPS),
# queue worker, scheduler, Redis and the analytics FastAPI service. PostgreSQL is Amazon RDS. Ollama runs natively on
# the same EC2 (systemd) and is reached as http://host.docker.internal:11434; a separate GPU EC2 is optional later.
#   cd deploy/aws && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Raw uploads live only in the app_storage volume (storage/app/tmp) and are purged by the scheduler.
name: dataspeak

x-app: &app
  image: dataspeak-api:latest
  build:
    context: ../..
    dockerfile: docker/backend/Dockerfile.prod
  env_file: .env.prod
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"   # Ollama installed on this EC2
  volumes:
    - app_storage:/app/storage
  depends_on:
    redis:
      condition: service_healthy
    analytics:
      condition: service_started
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  app:
    <<: *app
    container_name: dataspeak-api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - app_storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Caddy's admin endpoint answers only while the server is up; works for both the https and the http-only SERVER_NAME.
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    container_name: dataspeak-worker
    stop_grace_period: 120s
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,translations", "--tries=1", "--timeout=600", "--sleep=1", "--max-jobs=200"]

  scheduler:
    <<: *app
    container_name: dataspeak-scheduler
    command: ["php", "artisan", "schedule:work"]

  redis:
    image: redis:7-alpine
    container_name: dataspeak-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  analytics:
    build:
      context: ../..
      dockerfile: docker/analytics/Dockerfile
    image: dataspeak-analytics:latest
    container_name: dataspeak-analytics
    restart: unless-stopped
    environment:
      ANALYTICS_INTERNAL_TOKEN: ${ANALYTICS_INTERNAL_TOKEN}
      DATASPEAK_TMP_DIR: /tmp/dataspeak
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      LOG_LEVEL: INFO
    # No ports: reachable only from the other containers on this host (NFR-SEC-001b).
    tmpfs:
      - /tmp/dataspeak:mode=1777
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  app_storage:
  caddy_data:
  caddy_config:
  redis_data:
