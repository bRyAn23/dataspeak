# Data Speak API behind nginx. Installed by deploy.sh as /etc/nginx/sites-available/dataspeak-api (symlinked into
# sites-enabled); certbot adds the HTTPS server block and the redirect when a certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name api.dataspeaknow.com;

    client_max_body_size 60m;              # uploads (UPLOAD_MAX_MB=50 plus multipart overhead)
    proxy_read_timeout 600s;               # synchronous translation and PDF rendering can take minutes
    proxy_send_timeout 600s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
    }
}
